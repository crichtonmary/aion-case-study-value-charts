<style>
body{margin:0;background:#080f0b}
@property --n{syntax:'<integer>';inherits:false;initial-value:0}
.cs{--loop:infinite;--pad:clamp(20px,5vw,72px);--c-focus:var(--aion-future-green);--c-context:var(--aion-mid-green);background:var(--surface-page);color:var(--text-body);font-family:var(--font-sans);font-weight:300;font-size:18px;line-height:1.55;-webkit-font-smoothing:antialiased}
.cs *{box-sizing:border-box}
:where(.cs) :where(h1,h2,h3,p,figure,dl,dd){margin:0}
.nw{white-space:nowrap}
.cs a{color:var(--accent-flag);text-decoration:underline;text-decoration-color:rgba(254,166,73,.4);text-underline-offset:3px}
.cs a:hover{text-decoration-color:var(--accent-flag)}
.wrap{max-width:1360px;margin:0 auto;padding-left:var(--pad);padding-right:var(--pad)}
.acc{color:var(--text-accent)}
.cs h1,.cs h2,.cs h3,.big-label,.problem .stmt{text-wrap:balance}
.eyebrow{font-family:var(--font-mono);font-size:13px;line-height:1.4;letter-spacing:.28em;text-transform:uppercase;color:var(--text-accent)}
.label{font-family:var(--font-mono);font-size:12px;line-height:1.4;letter-spacing:.16em;text-transform:uppercase;color:var(--text-label)}
.rule{display:block;width:64px;height:3px;background:var(--accent)}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

.site{border-bottom:1px solid var(--border-hairline)}
.site .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 40px;padding-top:18px;padding-bottom:18px}
.site img{height:24px;width:auto;display:block}
.nav{display:flex;flex-wrap:wrap;align-items:center;gap:8px 32px}
.cs .nav a{color:var(--text-list);text-decoration:none;font-size:15px}
.cs .nav a[aria-current="page"]{color:var(--text-heading);box-shadow:inset 0 -2px 0 var(--accent);padding-bottom:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:48px;padding:0 22px;font-family:var(--font-mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;border:1px solid transparent;cursor:pointer}
.cs a.btn{text-decoration:none}
.cs a.btn:hover{opacity:.7}
.cs .btn-primary{background:var(--accent-flag);color:var(--aion-near-black)}
.cs .btn-line{border-color:var(--border-hairline);color:var(--text-heading)}
.cs .nav a.btn{color:var(--aion-near-black);font-size:12px;min-height:44px}

.hero .wrap{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:56px;align-items:center;padding-top:40px;padding-bottom:88px}
.crumb{display:flex;gap:10px;margin-bottom:48px}
.cs .crumb a{color:var(--text-secondary);text-decoration:none}
.hero h1{font-size:clamp(36px,3.8vw,54px);line-height:1.05;font-weight:500;letter-spacing:-.018em;color:var(--text-heading);margin:22px 0 30px}
.lead{font-size:clamp(18px,1.5vw,21px);line-height:1.5;color:var(--text-list);margin-top:30px;max-width:30em}
.status{margin-top:48px;padding-top:16px;border-top:1px solid var(--border-hairline)}

.ph{position:relative;background:var(--surface-panel);border:1px solid var(--border-hairline);overflow:hidden;display:flex;align-items:center;justify-content:center}
.ph-hero{aspect-ratio:16/11}
.ph-media{aspect-ratio:16/9}
.ph-x{position:absolute;inset:0;width:100%;height:100%}
.ph-x line{stroke:var(--border-hairline);stroke-width:1;vector-effect:non-scaling-stroke}
.ph-card{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;background:var(--surface-panel);border:1px solid var(--border-hairline);padding:24px 28px;max-width:78%}
.ph-title{font-size:20px;line-height:1.3;font-weight:500;color:var(--text-heading)}
.ph-spec{font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;color:var(--text-secondary)}
.ph-play{display:flex;align-items:center;justify-content:center;width:64px;height:64px;background:var(--accent);margin-bottom:6px}
.ph-play svg{width:22px;height:22px;fill:var(--aion-near-black);margin-left:3px}

.problem{background:var(--surface-emphasis)}
.problem .wrap{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,9fr);gap:24px 56px;padding-top:80px;padding-bottom:80px}
.problem .eyebrow{color:var(--accent-on-emphasis);padding-top:10px}
.problem .stmt{font-size:clamp(23px,2.35vw,34px);line-height:1.32;color:var(--text-body-on-emphasis);max-width:27em}
.problem strong{font-weight:500;color:var(--text-heading-on-emphasis)}

.sec{padding-top:120px;padding-bottom:120px}
.sec + .sec{border-top:1px solid var(--border-hairline)}
.sec-head{display:flex;flex-direction:column;gap:18px;margin-bottom:56px}
.sec h2{font-size:clamp(30px,3vw,42px);line-height:1.1;font-weight:500;letter-spacing:-.012em;color:var(--text-heading)}
.split{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:64px;align-items:center}
.body{font-size:18px;line-height:1.6;color:var(--text-body);max-width:33em}
.logos{display:flex;flex-wrap:wrap;align-items:center;gap:20px 40px;margin-bottom:44px}
.logos img{display:block;width:auto}

.val{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:64px;align-items:center}
.big{font-family:var(--font-mono);font-weight:500;font-size:clamp(76px,9vw,132px);line-height:.95;letter-spacing:-.04em;color:var(--text-accent)}
.big-label{font-size:clamp(22px,2vw,28px);line-height:1.25;font-weight:500;color:var(--text-heading);margin-top:20px}
.why{margin-top:14px;color:var(--text-secondary)}
.val .body{margin-top:32px}
.chart{container-type:inline-size;position:relative;background:var(--surface-panel);border:1px solid var(--border-hairline);padding:32px 36px 28px}
.chart-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 24px;margin-bottom:52px}
.chart-title{font-size:16px;font-weight:500;color:var(--text-heading)}
.chart-foot{margin-top:24px;padding-top:14px;border-top:1px solid var(--border-hairline-dense);font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-label)}
.ctr{counter-reset:n var(--n)}
.ctr::after{content:counter(n)}

.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;background:var(--surface-grid);border:2px solid var(--surface-grid);margin-top:72px}
.strip > div{background:var(--surface-panel);padding:28px 30px 30px}
.strip > div:last-child{background:var(--surface-emphasis)}
.fig{font-family:var(--font-mono);font-weight:500;font-size:clamp(32px,3vw,44px);line-height:1.1;color:var(--text-accent)}
.strip > div:last-child .fig{color:var(--accent-on-emphasis)}
.cap{margin-top:10px;font-size:16px;line-height:1.45;color:var(--text-body)}
.strip > div:last-child .cap{color:var(--text-body-on-emphasis)}

.cta{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:2px;background:var(--surface-grid);border:2px solid var(--surface-grid)}
.cta-book{background:var(--surface-emphasis);padding:56px 56px 60px;display:flex;flex-direction:column;gap:22px;align-items:flex-start}
.cta-book .eyebrow{color:var(--accent-on-emphasis)}
.cta-book h2{font-size:clamp(26px,2.5vw,36px);line-height:1.18;font-weight:500;color:var(--text-heading-on-emphasis);max-width:20em}
.cta-book p{color:var(--text-body-on-emphasis);max-width:32em}
.cs a.cta-next{background:var(--surface-panel);padding:56px;display:flex;flex-direction:column;gap:18px;text-decoration:none;color:var(--text-body)}
.cs a.cta-next:hover{opacity:.7}
.cta-next h3{font-size:clamp(22px,2vw,28px);line-height:1.22;font-weight:500;color:var(--text-heading)}
.cta-go{margin-top:auto;padding-top:24px;font-family:var(--font-mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-flag)}
.cta-all{margin-top:20px;text-align:right}

.foot{border-top:1px solid var(--border-hairline)}
.foot .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 32px;padding-top:28px;padding-bottom:32px}

/* Bar charts: one scale, square ends, values in text tokens */
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:14px;color:var(--text-secondary)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.key{display:inline-block;width:14px;height:14px}
.k-ctx{background:var(--c-context)}
.k-foc{background:var(--c-focus)}
.hb{--gl:170px;--gr:120px;position:relative}
.hb-grid{position:absolute;top:0;bottom:28px;left:var(--gl);right:var(--gr)}
.hb-grid span{position:absolute;top:0;bottom:0;width:1px;background:var(--border-hairline-dense)}
.hb-grid span:first-child{background:var(--text-label)}
.hb-grp{position:relative;display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 20px;align-items:center;padding:16px 0}
.hb-name{font-size:15px;line-height:1.35;color:var(--text-list)}
.hb-rows{display:flex;flex-direction:column;gap:4px;padding-right:var(--gr)}
.hb-row{position:relative;height:24px}
.hb-bar{position:absolute;left:0;top:0;bottom:0;width:var(--w);transform-origin:left center}
.bar-ctx{background:var(--c-context)}
.bar-foc{background:var(--c-focus)}
.hb-v{position:absolute;left:calc(var(--w) + 10px);top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:10px;white-space:nowrap;font-family:var(--font-mono);font-size:15px;color:var(--text-heading)}
.delta{font-size:12px;color:var(--text-secondary);border:1px solid var(--border-hairline);padding:2px 6px}
.hb-axis{position:relative;height:28px;margin-left:var(--gl);margin-right:var(--gr)}
.hb-axis span{position:absolute;top:8px;transform:translateX(-50%);font-family:var(--font-mono);font-size:12px;color:var(--text-label)}

.is-animated .a-b1{animation:barA 10s var(--loop) both}
.is-animated .a-b2{animation:barB 10s var(--loop) both}
.is-animated .a-l1{animation:labA 10s var(--loop) both}
.is-animated .a-l2{animation:labB 10s var(--loop) both}
.is-animated .a-d{animation:labC 10s var(--loop) both}
@keyframes barA{0%,5%{transform:scaleX(0);animation-timing-function:cubic-bezier(.2,.7,.2,1)}16%,100%{transform:scaleX(1)}}
@keyframes barB{0%,18%{transform:scaleX(0);animation-timing-function:cubic-bezier(.2,.7,.2,1)}29%,100%{transform:scaleX(1)}}
@keyframes labA{0%,13%{opacity:0}17%,100%{opacity:1}}
@keyframes labB{0%,26%{opacity:0}30%,100%{opacity:1}}
@keyframes labC{0%,32%{opacity:0}37%,100%{opacity:1}}

@media (max-width:900px){
.hero .wrap,.split,.val,.cta,.problem .wrap{grid-template-columns:minmax(0,1fr)}
.hero .wrap{gap:40px;padding-bottom:64px}
.crumb{margin-bottom:28px}
.sec{padding-top:80px;padding-bottom:80px}
.strip{grid-template-columns:minmax(0,1fr)}
.cta-book,.cs a.cta-next{padding:36px 28px}
.chart{padding:24px 20px 20px}
}
@container (max-width:560px){
.hb{--gl:0px;--gr:104px}
.hb-grid{display:none}
.hb-grp{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){
.is-animated *{animation:none !important}
}
</style>

<style>
/* Standalone build: charts play once when scrolled into view */
.js .cs{--loop:1}
.js .cs .val *{animation-play-state:paused}
.js .cs .val.in-view *{animation-play-state:running}

body{background:var(--surface-page)}
.cs .val{display:block}

/* Embed sizing: every value chart fills the same Wix iframe. */
html,body{height:auto;min-height:0}
body{overflow-x:hidden}
.cs,.cs .val{height:auto;min-height:0}
.chart{display:flex;width:100%;min-height:540px;aspect-ratio:16/10;flex-direction:column}
.chart-head{margin-bottom:36px}
.chart-foot{margin-top:auto}
@media (max-width:560px){
html,body,.cs,.cs .val{height:100%;min-height:100%}
.chart{height:100%;min-height:100%;aspect-ratio:auto}
.chart{padding:20px 18px 18px}
.chart-head{margin-bottom:24px}
.chart-title{font-size:14px;line-height:1.35}
.chart-foot{padding-top:10px;font-size:9px;line-height:1.45}
}
</style>

<body>
<div class="cs is-animated">
<div class="val">
<figure class="chart" aria-labelledby="c-title">
<figcaption class="chart-head">
<span class="chart-title" id="c-title">Assembly time and production cost, previous casing = 100</span>
<span class="legend"><span><i class="key k-ctx"></i>Previous casing</span><span><i class="key k-foc"></i>AION casing</span></span>
</figcaption>
<div class="hb" aria-hidden="true">
<div class="hb-grid"><span style="left: 0%"></span><span style="left: 25%"></span><span style="left: 50%"></span><span style="left: 75%"></span><span style="left: 100%"></span></div>
<div class="hb-grp">
<p class="hb-name">Assembly time</p>
<div class="hb-rows">
<div class="hb-row" style="--w: 100%" title="Previous casing: 100"><span class="hb-bar bar-ctx a-b1"></span><span class="hb-v a-l1">100</span></div>
<div class="hb-row" style="--w: 33%" title="AION casing: 33, 67% shorter"><span class="hb-bar bar-foc a-b2"></span><span class="hb-v a-l2">33 <span class="delta a-d">−67%</span></span></div>
</div>
</div>
<div class="hb-grp">
<p class="hb-name">Production cost</p>
<div class="hb-rows">
<div class="hb-row" style="--w: 100%" title="Previous casing: 100"><span class="hb-bar bar-ctx a-b1"></span><span class="hb-v a-l1">100</span></div>
<div class="hb-row" style="--w: 55%" title="AION casing: 55, 45% lower"><span class="hb-bar bar-foc a-b2"></span><span class="hb-v a-l2">55 <span class="delta a-d">−45%</span></span></div>
</div>
</div>
<div class="hb-axis"><span style="left: 0%">0</span><span style="left: 25%">25</span><span style="left: 50%">50</span><span style="left: 75%">75</span><span style="left: 100%">100</span></div>
</div>
<div class="sr"><table>
<caption>Assembly time and production cost, indexed to the previous casing = 100</caption>
<thead><tr><th scope="col">Measure</th><th scope="col">Previous casing</th><th scope="col">AION casing</th><th scope="col">Change</th></tr></thead>
<tbody>
<tr><th scope="row">Assembly time</th><td>100</td><td>33</td><td>−67%</td></tr>
<tr><th scope="row">Production cost</th><td>100</td><td>55</td><td>−45%</td></tr>
</tbody>
</table></div>
<p class="chart-foot">Indexed to the previous casing = 100</p>
</figure>
</div>
</div>
<script>
document.documentElement.classList.add('js');
(function(){
  var els=document.querySelectorAll('.val');
  if(!('IntersectionObserver' in window)){els.forEach(function(e){e.classList.add('in-view')});return;}
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in-view');io.unobserve(e.target);}});},{threshold:0.3});
  els.forEach(function(e){io.observe(e)});
})();
</script>
</body>
</html>
